<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contractable -- Nested Span Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-size: calc(0.9rem + 0.3vw);
    box-sizing: border-box;
  }
  *, *:before, *:after { box-sizing: inherit; }

  body {
    font-family: "Courier New", monospace;
    padding: 1.5vh 3vw;
    background-color: #000000;
    color: #ffffff;
    margin: 0;
    width: 100%;
  }

  .app-container {
    width: 100%;
    max-width: 32ch;
    margin: 0 auto;
    text-align: center;
  }

  h1 { margin-top: 0.5em; margin-bottom: 0.2em; font-size: 1.2em; }
  h2 { font-size: 0.85em; font-family: sans-serif; color: #cccccc; margin: 0 0 1em; font-weight: normal; }

  [hidden] { display: none !important; }

  #status {
    margin-top: 0.5em;
    font-weight: bold;
    font-family: sans-serif;
    color: #FFC107;
  }

  /* ── GAME BOARD ─────────────────────────────────────────── */
  #game-board {
    margin-top: 1em;
    display: flex;
    flex-direction: column;
    gap: 0.6em;
    width: 100%;
  }

  .row {
    outline: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.35em;
    flex-wrap: nowrap;
  }

  .row-visual {
    display: flex;
    align-items: center;
    gap: 0.35em;
  }

  /* One braille cell: 2 cols x 3 rows of dots, standard numbering
     1 4
     2 5
     3 6
  */
  .cell {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    grid-template-areas:
      "d1 d4"
      "d2 d5"
      "d3 d6";
    gap: 0.12em 0.16em;
    padding: 0.1em;
  }

  .dot {
    width: 0.62em;
    height: 0.62em;
    border-radius: 50%;
    background-color: #000000;
    border: 0.09em solid #ffffff;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .dot.on {
    background-color: #ffffff;
    border-color: #ffffff;
  }

  .dot.dot-1 { grid-area: d1; }
  .dot.dot-2 { grid-area: d2; }
  .dot.dot-3 { grid-area: d3; }
  .dot.dot-4 { grid-area: d4; }
  .dot.dot-5 { grid-area: d5; }
  .dot.dot-6 { grid-area: d6; }

  /* interactive variant used in the tappable test row */
  .cell.tappable .dot {
    cursor: pointer;
    width: 1.1em;
    height: 1.1em;
  }

  .row-label {
    font-size: 0.75em;
    color: #999999;
    font-family: sans-serif;
    width: 3.2em;
    flex-shrink: 0;
    text-align: right;
  }

  /* ── CONTROLS ───────────────────────────────────────────── */
  #controls {
    margin-top: 2em;
    width: 100%;
    padding-top: 1em;
    border-top: 0.08rem solid #444444;
  }

  #guess-label { display: block; margin-bottom: 0.5em; font-size: 0.9em; }

  #guess-input {
    font-family: monospace;
    width: 10ch;
    font-size: 1rem;
    background-color: #000000;
    color: #ffffff;
    border: 0.08rem solid #ffffff;
    padding: 0.4em;
    vertical-align: middle;
  }

  #submit-btn {
    font-family: sans-serif;
    background-color: #000000;
    color: #ffffff;
    border: 0.125rem solid #FFC107;
    padding: 0.3em 1em;
    font-weight: bold;
    cursor: pointer;
    font-size: 1.1rem;
    vertical-align: middle;
    margin-left: 0.4rem;
  }
  #submit-btn:hover { background-color: rgba(255, 193, 7, 0.15); }

  #add-row-btn {
    display: block;
    margin: 1em auto 0;
    font-family: sans-serif;
    background-color: #000000;
    color: #ffffff;
    border: 0.1rem solid #666666;
    padding: 0.4em 1em;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .test-link {
    display: inline-block;
    margin-top: 1em;
    color: #FFC107;
    font-family: sans-serif;
    font-size: 0.85em;
  }

  #tap-section {
    margin-top: 2em;
    padding-top: 1em;
    border-top: 0.08rem solid #444444;
  }
  #tap-section h2 { margin-bottom: 0.8em; }

  #debug-log {
    margin-top: 2em;
    font-size: 0.6em;
    color: #ff4d4d;
    border-top: 0.08rem solid #ccc;
    padding-top: 0.65rem;
    font-family: monospace;
    width: 100%;
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>

<div aria-label="title" aria-braillelabel="⠞⠊⠞⠇⠑">
  <span aria-label=" " aria-braillelabel="">the</span>>
  <span aria-label="false" aria-braillelabel="⠋">the</span>
  <span aria-label="true" aria-braillelabel="⠞">the</span>
</div>

<div aria-label="title" aria-braillelabel="⠞⠊⠞⠇⠑"><p> People. </p></div>

<div>
  <span aria-label=" " aria-braillelabel=“">the</span>>
  <span aria-label="false" aria-braillelabel="⠋">the</span>
  <span aria-label="true" aria-braillelabel="⠞">the</span>
</div>

</body>
</html>
