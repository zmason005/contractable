<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test: ingest-conversation</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --accent: #58a6ff; --border: #30363d;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #ffffff; --panel: #f6f8fa; --text: #1f2328; --accent: #0969da; --border: #d0d7de; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 1.2rem; }
  label { display: block; margin-top: 14px; font-size: 0.85rem; opacity: 0.8; }
  input, textarea { width: 100%; margin-top: 4px; padding: 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 0.9rem; }
  textarea { min-height: 90px; font-family: monospace; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 6px;
    background: var(--accent); color: white; font-size: 1rem; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 16px; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Test: ingest-conversation</h1>
  <label>Supabase publishable key</label>
  <input id="anonKey" type="text" placeholder="sb_publishable_...">

  <label>Organization</label>
  <input id="org" type="text" value="ANLLMS">

  <label>Source platform</label>
  <input id="platform" type="text" value="claude">

  <label>Test exchange (prompt / response)</label>
  <textarea id="prompt">What's the fastest way to check a Cloud Run container's startup logs?</textarea>
  <textarea id="response">Open the Console's Logs viewer for the specific failing revision, or use gcloud logging read from Cloud Shell for raw JSON.</textarea>

  <button onclick="sendTest()">Send test payload</button>
  <pre id="out">Result will appear here.</pre>
</div>
<script>
async function sendTest() {
  const out = document.getElementById('out');
  out.textContent = 'Sending...';
  const anonKey = document.getElementById('anonKey').value.trim();
  const payload = {
    organization: document.getElementById('org').value.trim(),
    source_platform: document.getElementById('platform').value.trim(),
    title: 'Test ingestion',
    exchanges: [{
      prompt: document.getElementById('prompt').value,
      response: document.getElementById('response').value
    }]
  };
  try {
    const res = await fetch('https://tppvzqtcfbyoncllukof.supabase.co/functions/v1/ingest-conversation', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': anonKey
      },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    out.textContent = 'Status: ' + res.status + '\n\n' + text;
  } catch (err) {
    out.textContent = 'Request failed: ' + err.message;
  }
}
</script>
</body>
</html>
