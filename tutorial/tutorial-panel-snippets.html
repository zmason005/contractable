<!-- ════════════════════════════════════════════════════════════════════
  1) CSS — paste at the end of your <style> block in index.html
═════════════════════════════════════════════════════════════════════ -->
<style>
  :root { --amber: #FFC107; }
  :focus-visible { outline: 4px solid var(--amber); outline-offset: 2px; }

  /* Visually hidden but still read by screen readers and braille displays */
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* The element the current step is pointing at */
  .tut-highlight { outline: 4px solid var(--amber); outline-offset: 2px; }

  .tut-btn {
    font-family: sans-serif; font-weight: bold; font-size: 1.1rem;
    background: #000; color: #fff; border: 0.125rem solid var(--amber);
    padding: 0.4em 1em; cursor: pointer; min-height: 44px;
  }
  .tut-btn:hover { background: rgba(255,193,7,0.15); }
  .tut-btn[aria-pressed="true"] { background: var(--amber); color: #000; }

  #tutorial-panel { margin-top: 2em; border-top: 1px solid #555; padding-top: 1em; }
  #tutorial-caption {
    font-family: sans-serif; font-size: 1.1rem; line-height: 1.4;
    border: 0.1rem solid #fff; padding: 0.75em; margin: 0 0 0.75em; text-align: left;
  }
  #tutorial-controls { display: flex; flex-wrap: wrap; gap: 0.5em; justify-content: center; }

  /* Optional: independent braille magnification later via this variable */
  html.high-contrast #tutorial-caption { border-color: var(--amber); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<!-- ════════════════════════════════════════════════════════════════════
  2) HTML — paste inside .app-container, below the #controls div
     (keep the settings <dialog> from tutorial-settings-modal.html too)
═════════════════════════════════════════════════════════════════════ -->

<!-- Empty on purpose: JS injects a fresh child for every announcement -->
<div id="tutorial-live-region" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<button id="start-tutorial" class="tut-btn" type="button">Start tutorial</button>

<section id="tutorial-panel" aria-label="Tutorial" hidden>
  <div id="tutorial-caption" tabindex="-1"></div>

  <div id="tutorial-controls" role="group" aria-label="Tutorial controls">
    <button id="tut-prev"   class="tut-btn" type="button">Previous step</button>
    <button id="tut-replay" class="tut-btn" type="button">Replay step</button>
    <button id="tut-next"   class="tut-btn" type="button">Next step</button>
    <button id="tut-auto"   class="tut-btn" type="button" aria-pressed="false">Auto-advance</button>
    <button id="open-tutorial-settings" class="tut-btn" type="button" aria-haspopup="dialog">Tutorial settings</button>
  </div>
</section>

<!-- ════════════════════════════════════════════════════════════════════
  3) JS — save the controller as tutorial-controller.js, then in index.html:
     <script src="tutorial-controller.js"></script>   (before main.js)
     and paste the block below into a new <script> after it.
═════════════════════════════════════════════════════════════════════ -->
<script>
  /* Real steps for the game. Braille drafts: please run them through your
     UEB engine to confirm before shipping. */
  const GAME_STEPS = [
    {
      id: "step_01_intro",
      title: "Step 1: Welcome",
      audioSrc: "assets/audio/tut_step1.mp3",
      captionText: "Welcome to CONTRACTABLE.",
      brailleUnicode: "⠠⠺⠑⠇⠉⠕⠍⠑⠀⠞⠕⠀⠠⠠⠒⠞⠗⠁⠉⠞⠁⠃⠇⠑⠲",
      highlightElementId: "game-board",
    },
    {
      id: "step_02_columns",
      title: "Step 2: The three columns",
      audioSrc: "assets/audio/tut_step2.mp3",
      captionText: "Correct, guess, wrong.",
      brailleUnicode: "⠠⠉⠕⠗⠗⠑⠉⠞⠂⠀⠛⠥⠑⠎⠎⠂⠀⠺⠗⠰⠛⠲",
      highlightElementId: "header",
    },
    {
      id: "step_03_type",
      title: "Step 3: Enter a guess",
      audioSrc: "assets/audio/tut_step3.mp3",
      captionText: "Type a guess.",
      brailleUnicode: "⠠⠞⠽⠏⠑⠀⠁⠀⠛⠥⠑⠎⠎⠲",
      highlightElementId: "guess-input",
    },
    {
      id: "step_04_submit",
      title: "Step 4: Submit",
      audioSrc: "assets/audio/tut_step4.mp3",
      captionText: "Press submit.",
      brailleUnicode: "⠠⠏⠗⠑⠎⠎⠀⠎⠥⠃⠍⠊⠞⠲",
      highlightElementId: "submit-btn",
    },
  ];

  const tutorial = new SegmentedTutorialController(GAME_STEPS);
  const $ = id => document.getElementById(id);

  // Open: reveal the panel, then start at step 1
  $("start-tutorial").addEventListener("click", () => {
    $("tutorial-panel").hidden = false;
    $("start-tutorial").hidden = true;
    tutorial.start();
  });

  $("tut-next").addEventListener("click",   () => tutorial.next());
  $("tut-prev").addEventListener("click",   () => tutorial.prev());
  $("tut-replay").addEventListener("click", () => tutorial.replay());

  // Settings dialog opener
  $("open-tutorial-settings").addEventListener("click", () => $("tutorial-settings").showModal());

  // Auto-advance button and the "Manual pacing" checkbox are the same setting:
  // the button flips the checkbox, and the checkbox's own change handler
  // (inside the controller) does the saving.
  const manualBox = $("opt-manual");
  const autoBtn = $("tut-auto");
  const syncAutoBtn = () => autoBtn.setAttribute("aria-pressed", String(!manualBox.checked));
  autoBtn.addEventListener("click", () => {
    manualBox.checked = !manualBox.checked;
    manualBox.dispatchEvent(new Event("change"));
  });
  manualBox.addEventListener("change", syncAutoBtn);
  syncAutoBtn();
</script>
