<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contractable</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-color: #ffffff;
      --accent-color: #FFC107;
      --border-color: #333333;
      --exact-match: #2e7d32;
      --partial-match: #f57f17;
      --no-match: #424242;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.05em;
    }

    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Grid Area */
    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .guess-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }

    .cell {
      aspect-ratio: 1;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-family: "Apple Braille", "Courier New", monospace;
      background-color: var(--card-bg);
      border-radius: 4px;
    }

    .cell.exact-match {
      background-color: var(--exact-match);
      border-color: var(--exact-match);
    }

    .cell.partial-match {
      background-color: var(--partial-match);
      border-color: var(--partial-match);
    }

    .cell.no-match {
      background-color: var(--no-match);
      border-color: var(--no-match);
    }

    /* Input Controls */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.9rem;
      color: #cccccc;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      font-size: 1.1rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #1e1e1e;
      color: #ffffff;
    }

    button {
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      background-color: var(--accent-color);
      color: #000000;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Narrative Status Region */
    #status-narrative-region {
      margin-top: 0.8em;
      text-align: left;
      font-family: sans-serif;
      font-size: 0.85em;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.04);
      border: 0.08rem solid var(--accent-color);
      padding: 0.8em 1em;
      border-radius: 0.2em;
    }

    .narrative-lead {
      margin: 0 0 0.5em 0;
      font-weight: bold;
      color: #ffffff;
    }

    .narrative-details {
      margin: 0 0 0.5em 0;
      padding-left: 1.2em;
      color: #dddddd;
    }

    .braille-summary-block {
      font-family: "Apple Braille", "Courier New", monospace;
      font-size: 1.2em;
      letter-spacing: 0.15em;
      white-space: pre;
      margin: 0.5em 0 0 0;
      color: var(--accent-color);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #debug-log {
      margin-top: 1rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: #ff6b6b;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>Contractable</h1>
  </header>

  <main>
    <!-- Game Board Grid -->
    <section class="game-grid" aria-label="Game Board">
      <div id="guess-row-1" class="guess-row">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div id="guess-row-2" class="guess-row">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div id="guess-row-3" class="guess-row">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div id="guess-row-4" class="guess-row">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div id="guess-row-5" class="guess-row">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div id="guess-row-6" class="guess-row">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </section>

    <!-- User Input Interface -->
    <section class="input-section">
      <label id="guess-label" for="guess-input">Enter 5-character Braille or text guess:</label>
      <div class="input-row">
        <input type="text" id="guess-input" maxlength="5" autocomplete="off" spellcheck="false" />
        <button id="submit-btn" type="button">Submit</button>
      </div>
    </section>

    <!-- Revamped Narrative Status Container -->
    <section id="status-narrative-region" aria-label="Game Feedback" hidden tabindex="-1">
      <p id="narrative-lead-in" class="narrative-lead"></p>
      <ul id="narrative-details-list" class="narrative-details"></ul>
      <pre id="narrative-summary-display" class="braille-summary-block"></pre>
      <div 
        id="narrative-aria-live" 
        class="sr-only" 
        aria-live="polite" 
        aria-atomic="true">
      </div>
    </section>

    <div id="debug-log"></div>
  </main>

  <!-- Script Dependencies (Root Directory) -->
  <script src="narrative.js"></script>
  <script src="main.js"></script>
</body>
</html>
